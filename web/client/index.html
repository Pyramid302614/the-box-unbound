<html>
    
    <head>

        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <title>Box</title>

    </head>

    <body>

        <div id="splash--container">
            <span id="splash"><b>The Box</b> <b class="gradient-lr">Unbound</b><br/><span id="loading-text">v 1 . 0 . 0</span></span>
        </div>

        <div id="nonsplash--container">
            
            <div style="height: calc(40px * var(--scale));"></div> <!--To account for the header-->
            <div id="messages-container">
                <span id="messages"></span>
            </div>
            
            <div id="header">
                <span id="header-content">You are <b id="name-display" class="gradient-lr">Pyramid30</b></span>
                <input id="nickname-textbox" type="text" placeholder="Set nickname here...">
            </div>
            <div style="height: calc(40px * var(--scale));"></div> <!--To account for the footer-->

            <div id="footer">
                <input id="message-textbox" type="text" placeholder="Type message here...">
            </div>

        </div>
        
    </body>

    <script src="script.js"></script>

</html>
